
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Lucky Draw 2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #052e16; /* Deep Forest Green */
            background-image: radial-gradient(circle at center, #064e3b 0%, #022c22 100%);
            color: #fef3c7; /* Light Cream Text */
        }
        .festive-font {
            font-family: 'Mountains of Christmas', cursive;
        }
        @keyframes snowfall {
            0% { transform: translateY(-10vh) translateX(0); }
            100% { transform: translateY(110vh) translateX(20px); }
        }
        .snowflake {
            position: fixed;
            top: -10px;
            color: white;
            user-select: none;
            z-index: 0;
            pointer-events: none;
            animation: snowfall linear infinite;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(251, 191, 36, 0.2); /* Gold-ish thumb */
            border-radius: 3px;
        }
        .gold-glow {
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.4);
        }
    </style>
